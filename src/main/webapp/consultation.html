<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Bank Consultation Appointment</title>
</head>
<body>

<h1>Book a Bank Consultation at LLB</h1>

<form>
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone"><br><br>

    <label for="topic">Consultation Topic:</label><br>
    <select id="topic" name="topic" required>
        <option value="">Please select</option>
        <option value="account">Open an Account</option>
        <option value="loan">Loan</option>
        <option value="mortgage">Mortgage</option>
        <option value="investment">Investment Advice</option>
        <option value="retirement">Retirement Planning</option>
    </select><br><br>

    <label for="date">Preferred Date:</label><br>
    <input type="date" id="date" name="date" required><br><br>

    <label for="time">Preferred Time:</label><br>
    <input type="time" id="time" name="time" required><br><br>

    <label for="message">Additional Information:</label><br>
    <textarea id="message" name="message"></textarea><br><br>

    <button type="submit">Submit Request</button>
</form>

</body>
</html>
